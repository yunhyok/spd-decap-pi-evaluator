name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-wheel:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests/test_spd_decap_packaging.py `
            tests/test_spd_decap_spd_adapter.py `
            tests/test_spd_decap_scenario_io.py `
            tests/test_spd_decap_distribution.py `
            tests/test_spd_decap_evaluation.py `
            tests/test_modal_convergence.py `
            tests/test_layer_surface_network.py::test_factor_pivot_ratio_rejects_forward_unreliable_real_superlu_result `
            tests/test_layer_surface_network.py::test_factor_pivot_ratio_ceiling_preserves_real_result_and_residual `
            tests/test_spd_decap_gui.py::test_csv_export_write_failure_preserves_destination_and_cleans_temp `
            tests/test_spd_decap_distribution_gui.py::test_full_preview_exports_saves_and_applies_one_atomic_revision `
            tests/test_spd_decap_gui.py::test_research_success_is_transient_and_exports_full_composite_identity `
            tests/test_spd_decap_gui.py::test_scenario_load_worker_is_cancelable_and_forwards_callback `
            tests/test_spd_decap_gui.py::test_close_during_scenario_load_cancels_and_preserves_document
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir wheelhouse
      - name: Fresh wheel boundary smoke
        run: |
          python -m venv "$env:RUNNER_TEMP\wheel-venv"
          $wheel = Get-ChildItem wheelhouse\*.whl | Select-Object -First 1
          & "$env:RUNNER_TEMP\wheel-venv\Scripts\python.exe" -m pip install $wheel.FullName
          & "$env:RUNNER_TEMP\wheel-venv\Scripts\python.exe" -m pip check
          Push-Location $env:RUNNER_TEMP
          try {
            & "$env:RUNNER_TEMP\wheel-venv\Scripts\python.exe" -c "import importlib.util, spd_decap_pi; assert importlib.util.find_spec('mlo_pdn') is None; assert spd_decap_pi.APP_DISPLAY_NAME == f'SPD Decap PI Evaluator v{spd_decap_pi.__version__}'"
          }
          finally {
            Pop-Location
          }
